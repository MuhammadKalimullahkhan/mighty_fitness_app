name: Flutter CI/CD

on:
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest # A Linux virtual machine for building

    steps:
      - uses: actions/checkout@v4 # 1. Check out repository code
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2 # 2. Set up the Flutter SDK
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get # 3. Install packages

      - name: Build APK
        run: flutter build apk --release # 4. Run the build command

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4 # 5. Upload the resulting APK
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk